name: Build KNcloud-WIN

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Create Release 步骤需要写权限（默认只读会 403）
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # xray-core v26.3.27 要求 go >= 1.26
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        shell: bash
        run: |
          cd frontend
          npm run build

      - name: Format check
        shell: bash
        # gofmt 不合规直接失败（防止格式回退进入主干）
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt 需要格式化: $unformatted"
            exit 1
          fi

      - name: Tidy check
        shell: bash
        # go.mod/go.sum 与代码必须同步（防止手工改依赖后 drift）
        run: |
          go mod tidy -diff 2>&1 | tee tidy-output.log
          exit ${PIPESTATUS[0]}

      - name: Tidy diagnostics
        if: failure()
        shell: bash
        # 失败时把 tidy 输出浓缩成单条 ::error:: 注解（日志 zip 下载不了时靠这条读错误）
        run: |
          { echo "=== tidy tail ==="; grep -v "^go: downloading" tidy-output.log | tail -40; } > diag.txt
          echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' diag.txt)"

      - name: Vet
        shell: bash
        # unsafeptr 关闭：代码里的 Win32 syscall 惯用法（uintptr↔unsafe.Pointer）会触发误报
        run: |
          go vet -unsafeptr=false ./... 2>&1 | tee vet-output.log
          exit ${PIPESTATUS[0]}

      - name: Vet diagnostics
        if: failure()
        shell: bash
        # 失败时把 vet 输出浓缩成单条 ::error:: 注解（注解有 10 条上限，
        # 逐行输出会被 go: downloading 刷掉；日志 zip 又下载不了时靠这条读错误）
        run: |
          { echo "=== vet tail ==="; grep -v "^go: downloading" vet-output.log | tail -40; } > diag.txt
          echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' diag.txt)"

      - name: Test
        shell: bash
        run: |
          go test ./... -count=1 -timeout 10m 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Test diagnostics
        if: failure()
        shell: bash
        run: |
          { echo "=== test tail ==="; grep -v "^go: downloading" test-output.log | tail -40; } > diag.txt
          echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' diag.txt)"

      - name: Build Application with Wails
        shell: bash
        # -nsis 同时产出 NSIS 安装器（wails 自动下载 NSIS 工具链）
        run: |
          wails build -platform windows/amd64 -clean -nsis

      - name: Rename & Stage Binary
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/KNcloud-WIN.exe dist/ || cp build/bin/*.exe dist/
          cp build/bin/*-installer.exe dist/ 2>/dev/null && echo "NSIS installer staged" || echo "WARN: no installer produced"
          ls -la dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNcloud-WIN-windows-amd64
          path: dist/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
