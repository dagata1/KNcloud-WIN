name: Build KNcloud-WIN

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  # PR 同样跑一遍：Windows 专属代码（DPAPI、Wintun、路由表）无法在
  # 其它平台编译验证，合并前必须有一次真实的 windows-latest 构建与测试。
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Create Release 步骤需要写权限（默认只读会 403）
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vet
        shell: bash
        run: |
          # 只做类型检查与常见错误扫描。unsafeptr 关掉：Win32 互操作里
          # unsafe.Slice / LazyProc.Call 的用法会被误报，且无法改写成 vet 认可的形式。
          go vet -unsafeptr=false ./...

      - name: Test
        shell: bash
        run: |
          # -short 跳过会动系统剪贴板 / 拉起浏览器的用例（见各测试里的 testing.Short 分支）。
          # 其余用例（退出死锁回归、日志并发、分享链接解析、路由表计算）全部照跑。
          go test -short -timeout 5m ./...

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          cd frontend
          npm ci

      - name: Build Application with Wails
        shell: bash
        run: |
          wails build -platform windows/amd64 -clean

      - name: Rename & Stage Binary
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/KNcloud-WIN.exe dist/ || cp build/bin/*.exe dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNcloud-WIN-windows-amd64
          path: dist/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
