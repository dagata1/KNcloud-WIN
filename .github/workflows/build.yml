name: Build KNcloud-WIN

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Create Release 步骤需要写权限（默认只读会 403）
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          cd frontend
          npm ci

      - name: Build Application with Wails
        shell: bash
        run: |
          # 版本号注入 main.appVersion：tag 构建用 tag（如 v1.3.27），其余构建为 dev
          #（dev 版本不提供在线更新，设置页「检查更新」只做提示）
          APP_VERSION="dev"
          case "$GITHUB_REF" in refs/tags/v*) APP_VERSION="${GITHUB_REF_NAME}" ;; esac
          echo "APP_VERSION=$APP_VERSION"
          wails build -platform windows/amd64 -clean -ldflags "-X main.appVersion=$APP_VERSION"

      - name: Rename & Stage Binary
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/KNcloud-WIN.exe dist/ || cp build/bin/*.exe dist/

      - name: Validate release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host '::warning::Release signing secrets are not configured; the executable will be unsigned.'
          }

      - name: Sign Windows executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./.github/scripts/sign-windows.ps1 dist\KNcloud-WIN.exe

      - name: Package portable folder
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="${GITHUB_SHA::7}" ;; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          go run ./tools/pack -exe dist/KNcloud-WIN.exe -out dist -version "$VERSION"
          rm dist/KNcloud-WIN.exe
          # 在线更新会下载并校验此文件（sha256sum 格式：<hex>  <文件名>）
          ZIP="KNcloud-WIN-$VERSION.zip"
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256")

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $makensis) {
            foreach ($p in "${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") {
              if (Test-Path $p) { $makensis = $p; break }
            }
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) { throw "makensis.exe not found" }
          & $makensis /VERSION
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer (Setup.exe)
        shell: pwsh
        run: |
          # 安装内容 = tools/pack 组装的绿色版文件夹（与 zip 完全一致）
          $vi = '0.0.0.0'
          if ($env:VERSION -match '^v?(\d+)\.(\d+)\.(\d+)') { $vi = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" }
          $src = (Resolve-Path dist\KNcloud).Path
          $out = Join-Path (Resolve-Path dist).Path "KNcloud-WIN-$env:VERSION-Setup.exe"
          Push-Location build\windows\installer
          & $env:MAKENSIS /V3 "/DSRC_DIR=$src" "/DVERSION=$env:VERSION" "/DVI_VERSION=$vi" "/DOUT_FILE=$out" project.nsi
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "makensis failed ($code)" }
          Get-Item $out | Format-List Name, Length

      - name: Sign installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./.github/scripts/sign-windows.ps1 "dist\KNcloud-WIN-$env:VERSION-Setup.exe"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNcloud-WIN-windows-amd64
          path: dist/KNcloud/

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNcloud-WIN-${{ env.VERSION }}-Setup
          path: dist/*-Setup.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
